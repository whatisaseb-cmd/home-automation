name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pandas numpy yfinance requests ccxt

    - name: Run bot_dca tests
      run: |
        cd bot_kraken
        pytest test_bot_dca.py -v --cov=bot_dca --cov-report=xml

    - name: Run update_linky tests
      run: |
        cd sonoff-energy
        pytest test_update_linky_history.py -v --cov=update_linky_history --cov-report=xml

    - name: Run app tests
      run: |
        pytest test_app.py -v --cov=app --cov-report=xml

    - name: Run all tests with coverage
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-fail-under=85

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Archive coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports
        path: htmlcov/

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        pip install pylint black flake8

    - name: Run black check
      run: black --check bot_kraken/*.py sonoff-energy/*.py *.py 2>/dev/null || echo "Black formatting issues found (non-blocking)"

    - name: Run flake8
      run: flake8 bot_kraken/*.py sonoff-energy/*.py *.py --max-line-length=120 --ignore=E501,W503 || echo "Flake8 issues found (non-blocking)"
